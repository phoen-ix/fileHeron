version: 2
# Weekly dependency-update PRs, grouped so minor/patch bumps land together.
# - pip: tracks backend/pyproject.toml ranges (regenerate requirements.lock via
#   `uv pip compile --generate-hashes` when a PR lands - Dependabot can't update
#   the uv lock itself).
# - npm: frontend tree (this is where the dev-only happy-dom/js-cookie advisories
#   get their upgrade PRs; they don't block CI since they aren't shipped).
# - github-actions: keeps the SHA-pinned action versions fresh.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  # The desktop client: watched by nothing until 2026-08-01, even though its
  # dependencies are the ones that end up INSIDE a signed-by-nobody .exe that
  # users download and run. httpx, keyring, pydantic, customtkinter and
  # tkinterdnd2 all ship in the bundle; an advisory in any of them was reaching
  # no one. The .exe carries its own 3.12 interpreter, which is why this tree
  # stays on 3.12 while the backend moved to 3.14.
  - package-ecosystem: pip
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, client]
    groups:
      client-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, frontend]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # These three majors were each offered, tried and rejected on 2026-07-31,
      # and Dependabot re-opened all three within minutes of the rejections
      # landing. Written down so the next person does not re-derive it.
      #
      # typescript: TS 7 removed the ./lib/tsc export, so `vue-tsc -b` dies and
      # the frontend IMAGE cannot be built - a release tag would publish no
      # frontend image and the in-app updater would have nothing to pull. No
      # published vue-tsc supports TS 7, and typescript-eslint's peer range ends
      # at <6.1.0. Revisit when both have shipped support; the repo is on the
      # 6.x ceiling meanwhile.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node must track the RUNTIME, not npm's latest. Types ahead of the
      # runtime type-check APIs that do not exist where the code runs: the build
      # passes and the image fails. Bump this by hand, with the node base image.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Container image pins. Added 2026-07-30: without this NOTHING watched them,
  # and the clamav pin sat four weeks behind a six-CVE security release while
  # pip/npm were kept current. Covers docker-compose.yml plus every Dockerfile.
  - package-ecosystem: docker
    directories:
      - /
      - /docker/backend
      - /docker/frontend
      - /docker/updater-shim
      - /docker/updater-executor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, docker]
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Node majors alternate: even = LTS, odd = Current, six months of support
      # and then nothing. Dependabot offers whatever is newest, which is how
      # `node:25-alpine` arrived for the image that builds the SPA published to
      # GHCR for public self-hosting. Minor/patch updates still flow; the LTS
      # transition is a once-a-year deliberate move, not a weekly PR.
      - dependency-name: node
        update-types: [version-update:semver-major]

  # The e2e tree has its own package-lock and was watched by NOTHING - not
  # dependabot, and not the dependency-audit job, which runs `npm audit` only
  # against frontend/. Two devDependencies (@playwright/test, otplib) that never
  # ship, so the exposure is CI-only; watched anyway because "nothing looks at
  # this lockfile" is how the clamav pin sat four weeks behind a six-CVE
  # release.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      e2e-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
