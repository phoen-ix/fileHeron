name: CI

# Tests on every push to main and every PR - so a broken backend (missing
# dep, broken migration, failed downgrade) surfaces BEFORE a release tag is
# cut, not during the tag build. Runs entirely on GitHub-hosted runners
# (never the production host).
on:
  push:
    branches: [main]
  pull_request: {}
  # Callable so server-release.yml can GATE a tag build on these exact jobs
  # rather than duplicating them. Before this, a release ran no tests at all:
  # lint, pytest, the alembic roundtrip and the dependency audit gated pushes
  # and PRs but never a tag, so a red main could still publish images to GHCR
  # and cut a GitHub release (audit 2026-07-30).
  workflow_call: {}

# Least privilege, and it matters more now that server-release.yml calls this
# workflow: a reusable workflow INHERITS the caller's permissions unless it
# declares its own, and the release grants contents:write + packages:write for
# publishing. Without this, every CI job would run with push-to-GHCR and
# write-releases rights during a tag build (audit 2026-07-30).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Per-job least privilege. The workflow-level block below already caps this
    # workflow, but a job-level declaration is what survives being called from
    # server-release.yml, and it makes each job's needs auditable on its own.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # [dev] adds pytest/httpx/aiosqlite/moto - CI-only; the runtime image
      # still installs only [project].dependencies via `pip install .`.
      - name: Install (with dev extras)
        run: pip install .[dev]
      # pip check guards the declared dependency closure (same gate the
      # backend image build runs).
      - name: pip check
        run: pip check
      # Lint gate (ruff config + curated ignores live in pyproject.toml).
      - name: Ruff
        run: ruff check .
      # The suite uses in-memory SQLite (conftest) and includes test_import_boot
      # (app.main + app.workers.worker import cleanly against the declared deps).
      # The alembic downgrade roundtrip stays skipped here (it needs a real
      # MariaDB); it runs in the dedicated `alembic-roundtrip` job below.
      - name: Pytest
        run: pytest -q -p no:cacheprovider -rs --durations=15

  # Exercises every migration's downgrade() up->down->up against a real MariaDB -
  # the engine prod uses. The main suite can't (SQLite can't run the MySQL DDL),
  # so without this the downgrade paths sit untested until a rollback needs them.
  alembic-roundtrip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
          MARIADB_DATABASE: fileheron_rt
          MARIADB_USER: rt
          MARIADB_PASSWORD: ci-rt-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev extras)
        run: pip install .[dev]
      - name: Alembic downgrade roundtrip (against MariaDB)
        env:
          RUN_ALEMBIC_ROUNDTRIP: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: fileheron_rt
          DB_USER: rt
          DB_PASSWORD: ci-rt-not-a-secret
          JWT_SECRET: ci-roundtrip-jwt-secret-aaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-roundtrip-tus-secret-aaaaaaaaaaaaaaaaaaaa
          APP_URL: http://ci.local
          APP_NAME: fileHeron
        run: pytest -q -p no:cacheprovider -rs tests/test_alembic_roundtrip.py

  # Runs the handful of tests that need a REAL Redis. The quota enforcement Lua
  # is the reason: the main suite's fake Redis re-implements it in Python, so the
  # script that decides whether an upload is refused was asserted against a mock
  # of itself and could not fail (audit 2026-07-30, tests-4). Skipped by default
  # like the alembic roundtrip; this job is where it actually runs.
  redis-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev extras)
        run: pip install .[dev]
      - name: Redis-backed tests
        env:
          RUN_REDIS_TESTS: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_SECRET: ci-redis-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-redis-tus-secret-aaaaaaaaaaaaaaaaaaaaaaaa
        run: pytest -q -p no:cacheprovider -rs tests/test_quota_lua_real_redis.py

  # Type-check + lint + unit-test the SPA.
  #
  # This job ran `npx vue-tsc --noEmit` from frontend/ and type-checked EXACTLY
  # ZERO FILES for its whole existence. frontend/tsconfig.json is solution-style
  # (`"files": []` plus two `references`); without `-b` (build mode) vue-tsc
  # honours neither reference, finds no inputs, and exits 0 unconditionally.
  # Measured: injecting `const x: number = "nope"` into src/utils/bytes.ts left
  # `--noEmit` at exit 0 with zero diagnostics, while `npm run build` exited 2
  # with the exact TS2322. A green gate that examines nothing is the same class
  # of defect as the route guard that walked zero routes (audit 2026-07-30).
  #
  # `npm run build` is `vue-tsc -b && vite build` - the script developers
  # already run, so it cannot drift from the local gate. `-b` also type-checks
  # tests/ (tsconfig.app.json includes it), and the bundle step catches an
  # import that type-checks but will not build.
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Type-check + build (vue-tsc -b && vite build)
        run: npm run build
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test

  # The desktop client's 147 tests ran ONLY on a `client-v*` release tag, so
  # every ordinary push and PR could break the client and nothing would say so
  # until release day - on a direct-push repo, that is the whole time between
  # client releases. The suite is AST/structural (CI has no tkinter), so it
  # needs no display and costs seconds (audit 2026-07-30).
  client-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: client/pyproject.toml
      - name: Install (with dev extras)
        run: pip install -e .[dev]
      - name: Pytest
        run: pytest -q -p no:cacheprovider -rs

  # Config, shell and workflow linting. None of these surfaces had ANY gate:
  # five shell scripts carry `# shellcheck disable=` directives that nothing has
  # ever validated, the workflows declare `workflow_call` + explicit permissions
  # blocks whose correctness is security-relevant, and nginx.conf ships to
  # production unparsed (audit 2026-07-30).
  infra-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck --severity=warning install.sh scripts/*.sh
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color
      - name: hadolint
        run: |
          for f in docker/*/Dockerfile docker/*/Dockerfile.dev; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 \
              hadolint --failure-threshold error - < "$f"
            echo "::endgroup::"
          done
      # nginx resolves proxy_pass upstreams at CONFIG-PARSE time, so the compose
      # service names must exist or `nginx -t` fails on DNS rather than on
      # syntax. --add-host stubs them; we are checking the config, not the
      # network.
      - name: nginx -t
        run: |
          docker run --rm --add-host backend:127.0.0.1 --add-host tusd:127.0.0.1 \
            -v "$PWD/docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  # Supply-chain audit of the deps that actually ship. Python: the hash-locked
  # requirements.lock is the source of truth. Node: --omit=dev so dev-only tool
  # CVEs (vitest/happy-dom etc., never bundled) don't block; Dependabot tracks
  # those separately. Fails on high/critical in production deps.
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: pip-audit (backend, hash-locked deps)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --progress-spinner off
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: npm audit (frontend, production deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
