name: CI

# Tests on every push to main and every PR - so a broken backend (missing
# dep, broken migration, failed downgrade) surfaces BEFORE a release tag is
# cut, not during the tag build. Runs entirely on GitHub-hosted runners
# (never the production host).
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # [dev] adds pytest/httpx/aiosqlite/moto - CI-only; the runtime image
      # still installs only [project].dependencies via `pip install .`.
      - name: Install (with dev extras)
        run: pip install .[dev]
      # pip check guards the declared dependency closure (same gate the
      # backend image build runs).
      - name: pip check
        run: pip check
      # The suite uses in-memory SQLite (conftest) and includes test_import_boot
      # (app.main + app.workers.worker import cleanly against the declared deps).
      # The alembic downgrade roundtrip stays skipped here (it needs a real
      # MariaDB); it runs in the dedicated `alembic-roundtrip` job below.
      - name: Pytest
        run: pytest -q -p no:cacheprovider

  # Exercises every migration's downgrade() up->down->up against a real MariaDB -
  # the engine prod uses. The main suite can't (SQLite can't run the MySQL DDL),
  # so without this the downgrade paths sit untested until a rollback needs them.
  alembic-roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
          MARIADB_DATABASE: fileheron_rt
          MARIADB_USER: rt
          MARIADB_PASSWORD: ci-rt-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev extras)
        run: pip install .[dev]
      - name: Alembic downgrade roundtrip (against MariaDB)
        env:
          RUN_ALEMBIC_ROUNDTRIP: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: fileheron_rt
          DB_USER: rt
          DB_PASSWORD: ci-rt-not-a-secret
          JWT_SECRET: ci-roundtrip-jwt-secret-aaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-roundtrip-tus-secret-aaaaaaaaaaaaaaaaaaaa
          APP_URL: http://ci.local
          APP_NAME: fileHeron
        run: pytest -q -p no:cacheprovider tests/test_alembic_roundtrip.py
