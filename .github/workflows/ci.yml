name: CI

# Tests on every push to main and every PR - so a broken backend (missing
# dep, broken migration, failed downgrade) surfaces BEFORE a release tag is
# cut, not during the tag build. Runs entirely on GitHub-hosted runners
# (never the production host).
on:
  push:
    branches: [main]
  pull_request: {}
  # Callable so server-release.yml can GATE a tag build on these exact jobs
  # rather than duplicating them. Before this, a release ran no tests at all:
  # lint, pytest, the alembic roundtrip and the dependency audit gated pushes
  # and PRs but never a tag, so a red main could still publish images to GHCR
  # and cut a GitHub release (audit 2026-07-30).
  workflow_call: {}

# Least privilege, and it matters more now that server-release.yml calls this
# workflow: a reusable workflow INHERITS the caller's permissions unless it
# declares its own, and the release grants contents:write + packages:write for
# publishing. Without this, every CI job would run with push-to-GHCR and
# write-releases rights during a tag build (audit 2026-07-30).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # [dev] adds pytest/httpx/aiosqlite/moto - CI-only; the runtime image
      # still installs only [project].dependencies via `pip install .`.
      - name: Install (with dev extras)
        run: pip install .[dev]
      # pip check guards the declared dependency closure (same gate the
      # backend image build runs).
      - name: pip check
        run: pip check
      # Lint gate (ruff config + curated ignores live in pyproject.toml).
      - name: Ruff
        run: ruff check .
      # The suite uses in-memory SQLite (conftest) and includes test_import_boot
      # (app.main + app.workers.worker import cleanly against the declared deps).
      # The alembic downgrade roundtrip stays skipped here (it needs a real
      # MariaDB); it runs in the dedicated `alembic-roundtrip` job below.
      - name: Pytest
        run: pytest -q -p no:cacheprovider

  # Exercises every migration's downgrade() up->down->up against a real MariaDB -
  # the engine prod uses. The main suite can't (SQLite can't run the MySQL DDL),
  # so without this the downgrade paths sit untested until a rollback needs them.
  alembic-roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
          MARIADB_DATABASE: fileheron_rt
          MARIADB_USER: rt
          MARIADB_PASSWORD: ci-rt-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with dev extras)
        run: pip install .[dev]
      - name: Alembic downgrade roundtrip (against MariaDB)
        env:
          RUN_ALEMBIC_ROUNDTRIP: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: fileheron_rt
          DB_USER: rt
          DB_PASSWORD: ci-rt-not-a-secret
          JWT_SECRET: ci-roundtrip-jwt-secret-aaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-roundtrip-tus-secret-aaaaaaaaaaaaaaaaaaaa
          APP_URL: http://ci.local
          APP_NAME: fileHeron
        run: pytest -q -p no:cacheprovider tests/test_alembic_roundtrip.py

  # Type-check + lint + unit-test the SPA. These all existed locally but never
  # ran in CI, so a broken frontend couldn't fail the pipeline. vue-tsc --noEmit
  # is the type half of the `build` script (vue-tsc -b && vite build) without
  # bundling; eslint + vitest are the repo's own npm scripts.
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test

  # Supply-chain audit of the deps that actually ship. Python: the hash-locked
  # requirements.lock is the source of truth. Node: --omit=dev so dev-only tool
  # CVEs (vitest/happy-dom etc., never bundled) don't block; Dependabot tracks
  # those separately. Fails on high/critical in production deps.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: pip-audit (backend, hash-locked deps)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --progress-spinner off
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'
      - name: npm audit (frontend, production deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
