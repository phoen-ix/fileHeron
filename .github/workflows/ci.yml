name: CI

# Tests on every push to main and every PR - so a broken backend (missing
# dep, broken migration, failed downgrade) surfaces BEFORE a release tag is
# cut, not during the tag build. Runs entirely on GitHub-hosted runners
# (never the production host).
on:
  push:
    branches: [main]
    # A prose-only push cannot break a test, and running the suite for one
    # buys nothing but a queue slot and, when the runner or GitHub itself is
    # having a bad day, a failure notification about a changelog edit. The
    # filter is on PUSH only: a PR still gets the full suite whatever it
    # touches, and `workflow_call` ignores path filters entirely, so the
    # release gate in server-release.yml is unaffected and a tag build still
    # runs every job below.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request: {}
  # Callable so server-release.yml can GATE a tag build on these exact jobs
  # rather than duplicating them. Before this, a release ran no tests at all:
  # lint, pytest, the alembic roundtrip and the dependency audit gated pushes
  # and PRs but never a tag, so a red main could still publish images to GHCR
  # and cut a GitHub release (audit 2026-07-30).
  workflow_call: {}

# Least privilege, and it matters more now that server-release.yml calls this
# workflow: a reusable workflow INHERITS the caller's permissions unless it
# declares its own, and the release grants contents:write + packages:write for
# publishing. Without this, every CI job would run with push-to-GHCR and
# write-releases rights during a tag build (audit 2026-07-30).
permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    # Per-job least privilege. The workflow-level block below already caps this
    # workflow, but a job-level declaration is what survives being called from
    # server-release.yml, and it makes each job's needs auditable on its own.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Install the LOCKED closure first, then the dev extras on top.
      #
      # `pip install .[dev]` alone resolves the `>=` ranges fresh from PyPI, so
      # the suite ran against whatever was newest that morning while the image
      # ships requirements.lock - two different dependency closures, with the
      # tested one being the closure that never reaches production (audit
      # 2026-07-30, deps-8). The lock goes in with hashes; `--no-deps` on the
      # project install stops pip re-resolving what the lock just pinned; the
      # dev tools are test-only and stay unpinned apart from ruff, which
      # pyproject pins deliberately.
      - name: Install locked runtime deps
        run: pip install --require-hashes -r requirements.lock
      - name: Install the project + dev extras
        run: |
          pip install --no-deps -e .
          pip install '.[dev]' --no-deps
          pip install pytest pytest-asyncio pytest-cov mypy aiosqlite 'moto[s3]' pip-audit
          pip install "ruff==$(sed -n 's/.*"ruff==\([0-9.]*\)".*/\1/p' pyproject.toml)"
      # pip check guards the declared dependency closure (same gate the
      # backend image build runs).
      - name: pip check
        run: pip check
      # Lint gate (ruff config + curated ignores live in pyproject.toml).
      - name: Ruff
        run: ruff check .
      # The suite uses in-memory SQLite (conftest) and includes test_import_boot
      # (app.main + app.workers.worker import cleanly against the declared deps).
      # The alembic downgrade roundtrip stays skipped here (it needs a real
      # MariaDB); it runs in the dedicated `alembic-roundtrip` job below.
      - name: Pytest
        run: pytest -q -p no:cacheprovider -rs --durations=15

  # Exercises every migration's downgrade() up->down->up against a real MariaDB -
  # the engine prod uses. The main suite can't (SQLite can't run the MySQL DDL),
  # so without this the downgrade paths sit untested until a rollback needs them.
  alembic-roundtrip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
          MARIADB_DATABASE: fileheron_rt
          MARIADB_USER: rt
          MARIADB_PASSWORD: ci-rt-not-a-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Install the LOCKED closure, not resolved ranges. backend-tests does this
      # already and explains why; these two jobs did not, so alembic-roundtrip
      # and redis-tests were exercising a dependency set that never ships
      # (audit #2, N-06). A schema or Lua defect that only appears under the
      # shipped versions could pass here.
      - name: Install (locked closure, matching the image)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install '.[dev]' --no-deps
          pip install pytest pytest-asyncio aiosqlite
      - name: Alembic downgrade roundtrip (against MariaDB)
        env:
          RUN_ALEMBIC_ROUNDTRIP: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: fileheron_rt
          DB_USER: rt
          DB_PASSWORD: ci-rt-not-a-secret
          JWT_SECRET: ci-roundtrip-jwt-secret-aaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-roundtrip-tus-secret-aaaaaaaaaaaaaaaaaaaa
          APP_URL: http://ci.local
          APP_NAME: fileHeron
        run: pytest -q -p no:cacheprovider -rs tests/test_alembic_roundtrip.py

  # Runs the handful of tests that need a REAL Redis. The quota enforcement Lua
  # is the reason: the main suite's fake Redis re-implements it in Python, so the
  # script that decides whether an upload is refused was asserted against a mock
  # of itself and could not fail (audit 2026-07-30, tests-4). Skipped by default
  # like the alembic roundtrip; this job is where it actually runs.
  redis-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      # Install the LOCKED closure, not resolved ranges. backend-tests does this
      # already and explains why; these two jobs did not, so alembic-roundtrip
      # and redis-tests were exercising a dependency set that never ships
      # (audit #2, N-06). A schema or Lua defect that only appears under the
      # shipped versions could pass here.
      - name: Install (locked closure, matching the image)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip install '.[dev]' --no-deps
          pip install pytest pytest-asyncio aiosqlite
      - name: Redis-backed tests
        env:
          RUN_REDIS_TESTS: '1'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          JWT_SECRET: ci-redis-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaa
          TUS_HOOK_SECRET: ci-redis-tus-secret-aaaaaaaaaaaaaaaaaaaaaaaa
        run: pytest -q -p no:cacheprovider -rs tests/test_quota_lua_real_redis.py

  # Type-check + lint + unit-test the SPA.
  #
  # This job ran `npx vue-tsc --noEmit` from frontend/ and type-checked EXACTLY
  # ZERO FILES for its whole existence. frontend/tsconfig.json is solution-style
  # (`"files": []` plus two `references`); without `-b` (build mode) vue-tsc
  # honours neither reference, finds no inputs, and exits 0 unconditionally.
  # Measured: injecting `const x: number = "nope"` into src/utils/bytes.ts left
  # `--noEmit` at exit 0 with zero diagnostics, while `npm run build` exited 2
  # with the exact TS2322. A green gate that examines nothing is the same class
  # of defect as the route guard that walked zero routes (audit 2026-07-30).
  #
  # `npm run build` is `vue-tsc -b && vite build` - the script developers
  # already run, so it cannot drift from the local gate. `-b` also type-checks
  # tests/ (tsconfig.app.json includes it), and the bundle step catches an
  # import that type-checks but will not build.
  frontend-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        run: npm ci --no-audit --no-fund
      - name: Type-check + build (vue-tsc -b && vite build)
        run: npm run build
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test

  # The desktop client's tests ran ONLY on a `client-v*` release tag, so
  # every ordinary push and PR could break the client and nothing would say so
  # until release day - on a direct-push repo, that is the whole time between
  # client releases. The suite is AST/structural (CI has no tkinter), so it
  # needs no display and costs seconds (audit 2026-07-30).
  #
  # ON WINDOWS TOO, since client-v1.3.0. This client ships as a Windows .exe and
  # NOTHING else, and this job ran on ubuntu only - so the sole Windows
  # execution of the suite was on the release tag itself, in
  # client-release.yml. A Windows-only defect was therefore undetectable until
  # the tag was already public: `zoneinfo.ZoneInfo("Europe/Vienna")` raises on
  # Windows (no system tz database), so the new site-timezone support silently
  # fell back to the machine's local zone - the exact thing it existed to fix,
  # on the only platform it runs on. The tag build caught it, which is to say
  # it was caught after the version number was spent.
  #
  # ubuntu stays in the matrix: it is where every OTHER job runs, it is faster,
  # and a divergence between the two is itself worth seeing.
  client-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: client/pyproject.toml
      - name: Install (with dev extras)
        run: pip install -e .[dev]
      - name: Pytest
        run: pytest -q -p no:cacheprovider -rs

      # The client had no lint or type gate of any kind - the backend's stops at
      # backend/. Its first run found a call whose import was missing, which the
      # structural tests could not see and which raised NameError on every
      # single-file download. Ubuntu leg only: the findings are platform-neutral
      # and running it twice would only double the noise on a failure.
      - name: Ruff
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install "ruff==$(sed -n 's/.*"ruff==\([0-9.]*\)".*/\1/p' ../backend/pyproject.toml)"
          ruff check .

      # Runs on every push, so a version mismatch is a red commit on main
      # rather than a burned tag. `client-v*` tags are immutable by repo
      # ruleset: once pushed, that number cannot be reused, and the release
      # workflow can only tell you the files disagree AFTER the tag exists.
      # client-v1.3.0 died that way (to a Windows-only test failure, which the
      # matrix above now catches on the same push).
      - name: Client version files must agree
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/fileheron_client/__init__.py | head -1)
          if [ "$pyproject" != "$init" ]; then
            echo "::error::pyproject.toml says '$pyproject' and __init__.py says '$init'."
            exit 1
          fi
          if ! head -5 RELEASE_NOTES.md | grep -qF "$pyproject"; then
            echo "::error::client/RELEASE_NOTES.md does not name $pyproject in its first 5 lines."
            echo "First line is: $(head -1 RELEASE_NOTES.md)"
            exit 1
          fi
          echo "client version $pyproject is consistent across all three files"

  # Config, shell and workflow linting. None of these surfaces had ANY gate:
  # five shell scripts carry `# shellcheck disable=` directives that nothing has
  # ever validated, the workflows declare `workflow_call` + explicit permissions
  # blocks whose correctness is security-relevant, and nginx.conf ships to
  # production unparsed (audit 2026-07-30).
  infra-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `docker/updater-shim/shim.sh` runs with the host docker socket mounted
      # and was linted by nothing, along with the backend entrypoint and the
      # mariadb init script - the glob only ever reached install.sh and
      # scripts/. Same class as "mypy was installed and INVOKED BY NOTHING"
      # below: the gate existed, its scope did not cover the risky code.
      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:v0.10.0 \
            shellcheck --severity=warning install.sh scripts/*.sh scripts/ops/*.sh \
            docker/updater-shim/shim.sh docker/backend/entrypoint.sh \
            docker/mariadb/init.sh
      # `docker/updater-executor/run.py` is 562 lines that run as root with the
      # host docker socket AND the host workspace mounted, and it was in
      # neither ruff's nor mypy's scope: both run with working-directory
      # `backend`. It carries its own ruff.toml that `extend`s the backend
      # config, so the rule set cannot drift; mypy reads the backend config
      # directly here for the same reason. Stdlib-only, so no install needed.
      - name: ruff + mypy (updater-executor, outside backend/)
        run: |
          RUFF_PIN=$(sed -n 's/.*"ruff==\([0-9.]*\)".*/\1/p' backend/pyproject.toml | head -1)
          MYPY_PIN=$(sed -n 's/.*"mypy==\([0-9.]*\)".*/\1/p' backend/pyproject.toml | head -1)
          docker run --rm -v "$PWD:/repo:ro" -w /repo python:3.14-slim sh -c "
            set -e
            pip install -q ruff==$RUFF_PIN mypy==$MYPY_PIN
            ruff check --no-cache docker/
            # --cache-dir: the mount is read-only, and mypy writes its cache
            # relative to the working directory - without this it dies with an
            # INTERNAL ERROR rather than a type error. ruff needs --no-cache for
            # the same reason.
            python -m mypy --cache-dir=/tmp/mypycache \
              --config-file backend/pyproject.toml docker/updater-executor/run.py
          "
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color
      # mypy was installed by backend-tests and INVOKED BY NOTHING, and
      # [tool.mypy] in pyproject.toml was read by nothing, for as long as both
      # existed - so "mypy is set up" was true and "mypy runs" was not
      # (audit #2). It then ran against 47 per-module `ignore_errors` exemptions
      # covering 37% of app/ by line; that list is now EMPTY and
      # tests/test_mypy_has_no_exemptions.py keeps it so.
      #
      # Install the LOCKED closure first, exactly as backend-tests does and for
      # the same reason: resolving `.[dev]` fresh type-checks against whatever
      # stubs PyPI served this morning, not the ones the image ships. pip output
      # is no longer swallowed - a failed install used to surface only as
      # "No module named mypy" from the next line.
      #
      # `scripts` is in scope too: it is the privileged operator tooling
      # (rotate_jwt_secret, promote_user, unblock_ip) and ruff has always
      # covered it.
      - name: mypy
        run: |
          docker run --rm -v "$PWD/backend:/w" -w /w -e PYTHONDONTWRITEBYTECODE=1 python:3.14-slim sh -c '
            set -e
            pip install --require-hashes -r requirements.lock
            pip install -e ".[dev]"
            python -m mypy app scripts
          '
      - name: hadolint
        run: |
          for f in docker/*/Dockerfile docker/*/Dockerfile.dev; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            docker run --rm -i hadolint/hadolint:v2.12.0 \
              hadolint --failure-threshold error - < "$f"
            echo "::endgroup::"
          done
      # nginx resolves proxy_pass upstreams at CONFIG-PARSE time, so the compose
      # The upstreams are now named through variables, so nginx no longer
      # resolves them at config load and `nginx -t` needs no --add-host stubs.
      # (That is the point of docker-9: a literal hostname made an unresolvable
      # upstream a STARTUP failure, so a slow tusd took the whole SPA down.)
      - name: nginx -t
        run: |
          docker run --rm \
            -v "$PWD/docker/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:alpine nginx -t

  # Supply-chain audit of the deps that actually ship. Python: the hash-locked
  # requirements.lock is the source of truth. Node: --omit=dev so dev-only tool
  # CVEs (vitest/happy-dom etc., never bundled) don't block; Dependabot tracks
  # those separately. Fails on high/critical in production deps.
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: pip-audit (backend, hash-locked deps)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock --progress-spinner off
      # The desktop client's runtime deps are BUNDLED into a distributed .exe -
      # end users cannot patch them, only a new release can - and nothing here
      # or in client-release.yml was auditing them. 3.12 to match the leg that
      # actually builds the executable. Runtime deps only: the `dev`/`build`
      # extras (pytest, pyinstaller) never ship.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pip-audit (desktop client, shipped runtime deps)
        working-directory: client
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off .
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - name: npm audit (frontend, production deps only)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
