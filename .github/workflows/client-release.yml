name: Build desktop client (Windows)

on:
  push:
    tags:
      - 'client-v*'
  # Allow manual runs for testing without a tag - they won't publish.
  workflow_dispatch: {}

permissions:
  contents: write   # softprops/action-gh-release writes to releases

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'client/pyproject.toml'

      - name: Install client + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./client[build,dev]"

      - name: Run unit tests
        working-directory: client
        run: pytest

      - name: Build .exe with PyInstaller
        working-directory: client
        run: |
          # NOTE: pyinstaller.spec sets upx=False (UPX corrupted _ssl.pyd
          # and gave no size win in --onefile; see the spec comment), so no
          # UPX install / --upx-dir is needed here.
          pyinstaller pyinstaller.spec --clean --noconfirm --log-level INFO

      - name: Show artifact
        working-directory: client
        run: |
          ls -lh dist/

      # Run the thing. Until now NOTHING executed the built .exe: the unit
      # tests gate the SOURCE, and a package whose data files the spec fails to
      # bundle passes every one of them and fails on a user's machine. That is
      # the shape that cost client-v1.3.0 a version number.
      #
      # A previous attempt used `Start-Process -Wait`, which hung on a
      # windowed (console=False) binary and stalled the release - so this waits
      # with a DEADLINE and kills the process if it is exceeded. A hang is then
      # a build failure, which is what it should have been in the first place.
      # `--selfcheck` returns before any Tk root is constructed, so it needs no
      # display.
      - name: Smoke-test the built .exe (--selfcheck)
        working-directory: client
        shell: pwsh
        run: |
          $exe = "dist/fileheron-client.exe"
          $out = New-TemporaryFile
          $err = New-TemporaryFile
          $p = Start-Process -FilePath $exe -ArgumentList "--selfcheck" `
                 -PassThru -NoNewWindow `
                 -RedirectStandardOutput $out -RedirectStandardError $err
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            Write-Host "--- stderr ---"; Get-Content $err
            throw "selfcheck did not finish within 120s - the bundle hangs on startup"
          }
          Write-Host "--- stdout ---"; Get-Content $out
          Write-Host "--- stderr ---"; Get-Content $err
          if ($p.ExitCode -ne 0) {
            throw "selfcheck failed (exit $($p.ExitCode)) - the .exe is missing bundled data"
          }
          Write-Host "selfcheck passed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fileheron-client-windows
          path: client/dist/fileheron-client.exe
          if-no-files-found: error

      # Only publish to a Release when the run was triggered by a
      # client-v* tag. Manual workflow_dispatch runs stop here.
      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/client-v')
        id: ver
        run: echo "version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"

      # Two guards the server release has and this one never got. Both failure
      # modes are silent: the release publishes, and the wrong thing is in it.
      #
      # NOTE the version, not the tag. The server workflow greps GITHUB_REF_NAME
      # ("v2.7.3") against its notes header, and copying that literally here
      # would fail every client release - the convention is
      # "# Desktop client 1.2.0", with no "client-v" prefix.
      - name: RELEASE_NOTES.md must name this version
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          set -euo pipefail
          if ! head -5 client/RELEASE_NOTES.md | grep -qF "${{ steps.ver.outputs.version }}"; then
            echo "::error::client/RELEASE_NOTES.md does not mention ${{ steps.ver.outputs.version }} in its first 5 lines."
            echo "First line is: $(head -1 client/RELEASE_NOTES.md)"
            exit 1
          fi

      # The server gets this free: its image carries an FH_VERSION build-arg
      # from the tag. The client's version is baked into the .exe from these two
      # files, so a tag that disagrees with them ships a binary that reports the
      # wrong version and no one finds out.
      - name: pyproject and __init__ must match the tag
        if: startsWith(github.ref, 'refs/tags/client-v')
        run: |
          set -euo pipefail
          want='${{ steps.ver.outputs.version }}'
          got_pyproject=$(sed -n 's/^version = "\(.*\)"/\1/p' client/pyproject.toml | head -1)
          got_init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' client/src/fileheron_client/__init__.py | head -1)
          if [ "$got_pyproject" != "$want" ] || [ "$got_init" != "$want" ]; then
            echo "::error::tag says $want but pyproject.toml says '$got_pyproject' and __init__.py says '$got_init'."
            exit 1
          fi
          echo "version $want matches both files"

      # The .exe is unsigned by design (build-and-self-sign is documented in
      # client/README.md); publish a SHA-256 so downloaders can verify integrity.
      - name: Checksum the .exe
        if: startsWith(github.ref, 'refs/tags/client-v')
        working-directory: client/dist
        run: sha256sum fileheron-client.exe | tee fileheron-client.exe.sha256

      - name: Publish release with .exe attached
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Desktop client ${{ steps.ver.outputs.version }}'
          # Ship the hand-written changelog, not auto-generated notes (the
          # auto "What's Changed" list mixes in backend commits since tags
          # share the repo). Update client/RELEASE_NOTES.md per release.
          body_path: client/RELEASE_NOTES.md
          files: |
            client/dist/fileheron-client.exe
            client/dist/fileheron-client.exe.sha256
