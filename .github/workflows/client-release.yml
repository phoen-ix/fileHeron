name: Build desktop client (Windows)

on:
  push:
    tags:
      - 'client-v*'
  # Allow manual runs for testing without a tag — they won't publish.
  workflow_dispatch: {}

permissions:
  contents: write   # softprops/action-gh-release writes to releases

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'client/pyproject.toml'

      - name: Install client + build deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "./client[build,dev]"

      # v0.4.1: pyinstaller.spec sets upx=True so the final .exe is
      # compressed. v0.4.0 tried choco for this; the install succeeded
      # but PyInstaller didn't find upx on PATH in the bash subprocess,
      # so the EXE step silently fell back to uncompressed (31 MB
      # instead of the targeted ~21 MB). This explicit download +
      # GITHUB_PATH update is debuggable and works in any shell.
      - name: Install UPX
        shell: bash
        run: |
          curl -sSL -o upx.zip https://github.com/upx/upx/releases/download/v5.1.1/upx-5.1.1-win64.zip
          mkdir -p /c/upx
          unzip -j -o upx.zip 'upx-*/upx.exe' -d /c/upx
          /c/upx/upx.exe --version
          echo "C:\\upx" >> "$GITHUB_PATH"

      - name: Run unit tests
        working-directory: client
        run: pytest

      - name: Build .exe with PyInstaller
        working-directory: client
        run: |
          # --log-level INFO surfaces "Packing executable with UPX" so
          # we can confirm in the build log that compression ran.
          pyinstaller pyinstaller.spec --clean --noconfirm --log-level INFO

      - name: Show artifact
        working-directory: client
        run: |
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fileheron-client-windows
          path: client/dist/fileheron-client.exe
          if-no-files-found: error

      # Only publish to a Release when the run was triggered by a
      # client-v* tag. Manual workflow_dispatch runs stop here.
      - name: Compute release version
        if: startsWith(github.ref, 'refs/tags/client-v')
        id: ver
        run: echo "version=${GITHUB_REF_NAME#client-v}" >> "$GITHUB_OUTPUT"

      - name: Publish release with .exe attached
        if: startsWith(github.ref, 'refs/tags/client-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Desktop client ${{ steps.ver.outputs.version }}'
          generate_release_notes: true
          files: client/dist/fileheron-client.exe
