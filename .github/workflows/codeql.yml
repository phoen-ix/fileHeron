name: CodeQL

# Static analysis (SAST) for a security-critical file-sharing tool. Free for
# public repos. Findings land in the repo's Security -> Code scanning tab; this
# workflow does not block PRs by itself (gate it via branch protection if you
# want that). Python + the SPA are both interpreted, so build-mode: none.
# A push that changes only prose changes nothing this workflow can analyse, but
# it still ran the full extraction and, on a bad day upstream, emailed a
# failure for it: `7d8b5bc` touched RELEASE_NOTES.md and CLAUDE.md and started a
# CodeQL analysis. Same filter shape e2e.yml already uses, and the weekly
# schedule below still covers everything regardless of what changed.
on:
  push:
    branches: [main]
    # Written out twice rather than shared via a YAML anchor: an alias is legal
    # YAML and `actionlint` rejects it ("must be sequence node but got alias
    # node"), which is what infra-lint enforces.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    - cron: '27 3 * * 1'  # weekly, Monday 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          category: "/language:${{ matrix.language }}"
