name: E2E

# Playwright against the REAL stack: builds the prod images from source, stands
# the compose stack up (AV_SKIP + seeded accounts via docker-compose.e2e.yml),
# and drives the critical user journeys. Catches the integration breakage the
# 980 backend + 167 vitest unit tests can't see (router guards, silent refresh,
# the upload + public-link wiring). Slower than the unit gates, so it's its own
# workflow: runs daily + on-demand (workflow_dispatch) + on any PR. This is a
# direct-to-main repo (no PRs, no branch protection), so the DAILY run is the
# real safety net - it can't gate a direct push (the check can't run before the
# push lands).
on:
  pull_request: {}
  workflow_dispatch: {}
  # Path-filtered push trigger. No check can GATE a push on a direct-push repo,
  # but waiting up to 24h for the daily run to tell you the stack is broken is a
  # choice, not a constraint. The filter keeps doc-only and comment-only pushes
  # quiet while covering everything that can actually break the stack.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  # Daily so the suite has real teeth on a direct-to-main repo (PRs are rare),
  # and so base-image drift and dependency rot surface even in a quiet week -
  # which the path filter deliberately misses.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# One stack build at a time. Without this, a wave of pushes queues a full
# `compose up --build` per push; with workers:1 and a 3-retry Docker Hub build,
# that turns the gate into a permanently-lagging backlog.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: fileheron_e2e
      E2E_BACKEND_CONTAINER: fileheron_e2e-backend
      # Compose requires these (${VAR:?}); test-only values.
      DB_ROOT_PASSWORD: e2e-root-not-a-secret
      DB_PASSWORD: e2e-db-not-a-secret
      JWT_SECRET: e2e-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TUS_HOOK_SECRET: e2e-tus-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      APP_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare data dirs (UID-1000-owned, as the containers write them)
        # backend/worker/tusd run as UID 1000; the bind-mount sources are
        # runner-owned at checkout, so writes (uploads, files) would 500 with
        # EACCES. Mirror install.sh. (db/redis manage their own 999-owned dirs.)
        run: |
          mkdir -p data/files data/uploads data/quarantine data/updater
          sudo chown -R 1000:1000 data/files data/uploads data/quarantine data/updater

      - name: Build + start the stack
        # Retry: Docker Hub base-image pulls (mariadb/nginx) intermittently 502 /
        # time out from GitHub runners. up --build is idempotent, so just retry.
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build && exit 0
            echo "::warning::build/up attempt $i failed (likely a Docker Hub hiccup); retrying in 20s"
            sleep 20
          done
          echo "build/up failed after 3 attempts"; exit 1

      - name: Wait for the stack to answer
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1 \
               && curl -fsS http://localhost:8080/ >/dev/null 2>&1; then
              echo "stack ready"; exit 0
            fi
            sleep 5
          done
          echo "stack never became ready"; exit 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # `npm ci` against a committed lockfile. This ran bare `npm install` with
      # no lockfile in e2e/, so @playwright/test and otplib resolved fresh on
      # every run - an unpinned dependency tree deciding whether the release
      # gate passes. CONTRIBUTING.md:41 already told contributors to run
      # `npm ci` here, which could only ever have failed (audit 2026-07-30).
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        run: npx playwright test

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=300

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
