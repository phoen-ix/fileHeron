name: E2E

# Playwright against the REAL stack: builds the prod images from source, stands
# the compose stack up (AV_SKIP + seeded accounts via docker-compose.e2e.yml),
# and drives the critical user journeys. Catches the integration breakage the
# the backend and vitest unit suites can't see (router guards, silent refresh,
# the upload + public-link wiring). Slower than the unit gates, so it's its own
# workflow: runs daily + on-demand (workflow_dispatch) + on any PR. This is a
# direct-to-main repo (no PRs, no branch protection), so the DAILY run is the
# real safety net - it can't gate a direct push (the check can't run before the
# push lands).
on:
  pull_request: {}
  workflow_dispatch: {}
  # Callable, so the release gate can require it. A tag that publishes images
  # with the edge broken is the one case where waiting for the daily run is
  # useless - the images are already out (audit #2).
  workflow_call: {}
  # Path-filtered push trigger. No check can GATE a push on a direct-push repo,
  # but waiting up to 24h for the daily run to tell you the stack is broken is a
  # choice, not a constraint. The filter keeps doc-only and comment-only pushes
  # quiet while covering everything that can actually break the stack.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker/**'
      - 'docker-compose*.yml'
      - 'e2e/**'
      - 'scripts/e2e.sh'
      - '.github/workflows/e2e.yml'
  # Daily so the suite has real teeth on a direct-to-main repo (PRs are rare),
  # and so base-image drift and dependency rot surface even in a quiet week -
  # which the path filter deliberately misses.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

# One stack build at a time. Without this, a wave of pushes queues a full
# `compose up --build` per push; with workers:1 and a 3-retry Docker Hub build,
# that turns the gate into a permanently-lagging backlog.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    # Two shards, each on its own stack; the docs tour runs after shard 2.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      COMPOSE_PROJECT_NAME: fileheron_e2e
      # Compose requires these (${VAR:?}) for the pre-build below; scripts/e2e.sh
      # sets the same test-only values itself.
      DB_ROOT_PASSWORD: e2e-root-not-a-secret
      DB_PASSWORD: e2e-db-not-a-secret
      JWT_SECRET: e2e-jwt-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      TUS_HOOK_SECRET: e2e-tus-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      E2E_IMAGE_TAG: fileheron_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the images
        # Retry: Docker Hub base-image pulls (mariadb/nginx) intermittently 502 /
        # time out from GitHub runners. The build cache makes the script's own
        # `up --build` below a no-op rebuild.
        run: |
          for i in 1 2 3; do
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml build backend worker frontend oidc \
              && docker compose -f docker-compose.yml -f docker-compose.e2e.yml pull db redis tusd clamav updater-shim && exit 0
            echo "::warning::build attempt $i failed (likely a Docker Hub hiccup); retrying in 20s"
            sleep 20
          done
          echo "build failed after 3 attempts"; exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # `npm ci` against a committed lockfile. This ran bare `npm install` with
      # no lockfile in e2e/, so @playwright/test and otplib resolved fresh on
      # every run - an unpinned dependency tree deciding whether the release
      # gate passes. CONTRIBUTING.md:41 already told contributors to run
      # `npm ci` here, which could only ever have failed (audit 2026-07-30).
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      # The suite as locally: scripts/e2e.sh starts the stack (SPA on 8080,
      # API 8083, the stand-in OIDC IdP 8084) and runs this shard's specs;
      # shard 2 then runs the docs tour as a render check - every page the
      # README shows, mounted in a real browser against this stack, failing on
      # an uncaught page error or a missing element (v2.17.1 shipped an admin
      # sidebar showing only "Overview" because nothing rendered it). The tour
      # runs LAST because it seeds a demo organisation and changes settings the
      # specs rely on; its screenshots carry the e2e fixtures - never commit
      # them, the README's come from scripts/docs-screenshots.sh (or
      # docs-screenshots.yml). E2E_FULL_STACK adds clamav and the updater shim,
      # and the script ends by requiring every container running and healthy:
      # this stack is the one place the capability policy in docker-compose.yml
      # (cap_drop ALL + a measured cap_add per service) is exercised, and `up`
      # returning 0 is not a verdict on it. The script tears the stack down in
      # its trap and writes the stack log to $ARTIFACTS/stack.log on failure.
      - name: E2E suite (shard ${{ matrix.shard }}/2) + docs tour (render check)
        env:
          ARTIFACTS: ${{ runner.temp }}/e2e
          E2E_FULL_STACK: '1'
          E2E_DOCS_TOUR: ${{ matrix.shard == 2 && '1' || '0' }}
        run: bash scripts/e2e.sh --shard=${{ matrix.shard }}/2

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e/playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: docs-tour-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/docs-tour/
            ${{ runner.temp }}/e2e/test-results/
            ${{ runner.temp }}/e2e/docs-tour-results/
            ${{ runner.temp }}/e2e/stack.log
          if-no-files-found: ignore
          retention-days: 7
