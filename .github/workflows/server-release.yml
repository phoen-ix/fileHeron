name: Build & publish server images (GHCR)

on:
  push:
    tags:
      # SemVer release tags. Mirrors the client workflow's `client-v*`
      # convention but for the server stack. Tag like `v0.2.0`.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual runs are allowed for testing the build path; they push to
  # ghcr.io with a `dev-<sha>` tag instead of stamping a real release.
  workflow_dispatch: {}

permissions:
  contents: write    # softprops/action-gh-release writes to releases
  packages: write    # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Build each image in parallel. Fail-fast off so a single image's
      # failure leaves the others' artifacts intact for diagnosis.
      fail-fast: false
      matrix:
        include:
          - image: fileheron-backend
            dockerfile: docker/backend/Dockerfile
            # Boot-gate: build to the local daemon, actually run it against a
            # throwaway DB and require /api/health 200 before pushing.
            boot_smoke: true
          - image: fileheron-worker
            # Worker shares the backend image - same Python, same code,
            # different ENTRYPOINT (ARQ vs uvicorn). Building both lets
            # us pin versions independently if we ever split them.
            dockerfile: docker/backend/Dockerfile
          - image: fileheron-frontend
            dockerfile: docker/frontend/Dockerfile
          - image: fileheron-updater-shim
            # v1.0.0: tiny perpetual shim (~50 lines bash). Polls the
            # state file, spawns the matching executor image. Designed
            # to never need updating - no business logic.
            dockerfile: docker/updater-shim/Dockerfile
          - image: fileheron-updater-executor
            # v1.0.0: ephemeral worker. Spawned by the shim per update,
            # pulls images + runs `compose up -d` + exits. Can change
            # freely between releases - the shim always pulls the
            # matching version per request.
            dockerfile: docker/updater-executor/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve version + tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"      # e.g. v0.2.0
            EXTRA_TAG="latest"
          else
            VERSION="dev-${GITHUB_SHA:0:12}"
            EXTRA_TAG=""                      # no :latest on manual runs
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$EXTRA_TAG" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BASE="ghcr.io/${REPO_LOWER}/${{ matrix.image }}"
          TAGS="${BASE}:${{ steps.meta.outputs.version }}"
          if [ -n "${{ steps.meta.outputs.extra_tag }}" ]; then
            TAGS="${TAGS},${BASE}:${{ steps.meta.outputs.extra_tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The backend leg builds to the local daemon (load) so it can be
          # boot-smoked before publishing - a broken backend image never
          # reaches GHCR. Every other leg pushes directly. (The Dockerfile's
          # import-smoke RUN still runs for both backend and worker builds.)
          push: ${{ matrix.boot_smoke != true }}
          load: ${{ matrix.boot_smoke == true }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FH_VERSION=${{ steps.meta.outputs.version }}
            FH_GIT_SHA=${{ steps.meta.outputs.git_sha }}
          # Cache via GHA's per-repo cache; halves cold-build time on
          # tag pushes that follow recent main commits.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # Build amd64 only. The host runs amd64; multi-arch ramps the
          # build time without callers asking for it today. Add arm64
          # when a self-hoster requests it.
          platforms: linux/amd64

      # --- Boot-gate (backend only) -------------------------------------
      # Actually run the freshly-built image: the entrypoint runs
      # `alembic upgrade head` then uvicorn, and we require /api/health to
      # return 200. Catches missing runtime deps, broken migrations, missing
      # files, and prod-config fail-fasts BEFORE the image is pushed or a
      # GitHub Release is created - the exact class of failure that shipped
      # in v1.25.0/.1 and took prod down.
      - name: Boot-smoke the backend image
        if: ${{ matrix.boot_smoke == true }}
        run: |
          set -euo pipefail
          IMG="$(echo '${{ steps.tags.outputs.tags }}' | cut -d, -f1)"
          echo "::group::boot-smoke $IMG"
          docker network create fhsmoke
          docker run -d --name fhsmoke-db --network fhsmoke \
            -e MARIADB_ROOT_PASSWORD=ci-root-not-a-secret \
            -e MARIADB_DATABASE=fileheron \
            -e MARIADB_USER=fileheron_app \
            -e MARIADB_PASSWORD=ci-db-not-a-secret \
            mariadb:11
          echo "waiting for MariaDB to accept connections..."
          for i in $(seq 1 60); do
            if docker exec fhsmoke-db healthcheck.sh --connect --innodb_initialized 2>/dev/null; then
              echo "MariaDB ready"; break
            fi
            [ "$i" = 60 ] && { echo "FATAL: MariaDB never came up"; docker logs fhsmoke-db; exit 1; }
            sleep 2
          done
          # ENVIRONMENT=production exercises the real prod boot path (the
          # insecure-default fail-fasts only WARN in development), so we pass
          # real >=32-char non-placeholder secrets. Redis/ClamAV are absent;
          # /api/health degrades those subfields but still returns 200 once
          # `SELECT 1` succeeds - which proves migrations ran and the app booted.
          docker run -d --name fhsmoke-app --network fhsmoke -p 127.0.0.1:8000:8000 \
            -e ENVIRONMENT=production \
            -e DB_HOST=fhsmoke-db -e DB_PORT=3306 \
            -e DB_USER=fileheron_app -e DB_PASSWORD=ci-db-not-a-secret -e DB_NAME=fileheron \
            -e JWT_SECRET=ci-boot-smoke-jwt-secret-aaaaaaaaaaaaaaaaaa \
            -e TUS_HOOK_SECRET=ci-boot-smoke-tus-hook-secret-bbbbbbbbbbbb \
            "$IMG"
          echo "waiting for /api/health == 200..."
          ok=0
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8000/api/health || true)"
            if [ "$code" = "200" ]; then echo "health 200 after ~$((i*2))s"; ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "FATAL: /api/health never returned 200"; exit 1
          fi
          echo "boot-smoke OK"
          echo "::endgroup::"
      - name: Boot-smoke logs on failure
        if: ${{ failure() && matrix.boot_smoke == true }}
        run: |
          echo "=== app logs ==="; docker logs fhsmoke-app 2>&1 | tail -120 || true
          echo "=== db logs ===";  docker logs fhsmoke-db  2>&1 | tail -40  || true
      - name: Boot-smoke cleanup
        if: ${{ always() && matrix.boot_smoke == true }}
        run: docker rm -f fhsmoke-app fhsmoke-db >/dev/null 2>&1 || true

      # Publish the backend image only AFTER it booted cleanly.
      - name: Push backend image (post-smoke)
        if: ${{ matrix.boot_smoke == true }}
        run: |
          set -euo pipefail
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"
          for t in "${TAGS[@]}"; do echo "pushing $t"; docker push "$t"; done

  release:
    # Only when a real `v*` tag triggered the workflow - manual runs
    # skip the release publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout so the release body can be read from the repo's RELEASE_NOTES.md.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Server ${{ github.ref_name }}'
          # Hand-written changelog - admins read this from the in-app Update
          # banner (/admin/system), so it must NOT be auto-generated. Update
          # RELEASE_NOTES.md per release; it also lists the published images.
          body_path: RELEASE_NOTES.md
