name: Build & publish server images (GHCR)

on:
  push:
    tags:
      # SemVer release tags. Mirrors the client workflow's `client-v*`
      # convention but for the server stack. Tag like `v0.2.0`.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Manual runs are allowed for testing the build path; they push to
  # ghcr.io with a `dev-<sha>` tag instead of stamping a real release.
  workflow_dispatch: {}

permissions:
  contents: write    # softprops/action-gh-release writes to releases
  packages: write    # push to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # Build each image in parallel. Fail-fast off so a single image's
      # failure leaves the others' artifacts intact for diagnosis.
      fail-fast: false
      matrix:
        include:
          - image: fileheron-backend
            dockerfile: docker/backend/Dockerfile
          - image: fileheron-worker
            # Worker shares the backend image — same Python, same code,
            # different ENTRYPOINT (ARQ vs uvicorn). Building both lets
            # us pin versions independently if we ever split them.
            dockerfile: docker/backend/Dockerfile
          - image: fileheron-frontend
            dockerfile: docker/frontend/Dockerfile
          - image: fileheron-updater-shim
            # v1.0.0: tiny perpetual shim (~50 lines bash). Polls the
            # state file, spawns the matching executor image. Designed
            # to never need updating — no business logic.
            dockerfile: docker/updater-shim/Dockerfile
          - image: fileheron-updater-executor
            # v1.0.0: ephemeral worker. Spawned by the shim per update,
            # pulls images + runs `compose up -d` + exits. Can change
            # freely between releases — the shim always pulls the
            # matching version per request.
            dockerfile: docker/updater-executor/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version + tags
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"      # e.g. v0.2.0
            EXTRA_TAG="latest"
          else
            VERSION="dev-${GITHUB_SHA:0:12}"
            EXTRA_TAG=""                      # no :latest on manual runs
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "extra_tag=$EXTRA_TAG" >> "$GITHUB_OUTPUT"
          echo "git_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REPO_LOWER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          BASE="ghcr.io/${REPO_LOWER}/${{ matrix.image }}"
          TAGS="${BASE}:${{ steps.meta.outputs.version }}"
          if [ -n "${{ steps.meta.outputs.extra_tag }}" ]; then
            TAGS="${TAGS},${BASE}:${{ steps.meta.outputs.extra_tag }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            FH_VERSION=${{ steps.meta.outputs.version }}
            FH_GIT_SHA=${{ steps.meta.outputs.git_sha }}
          # Cache via GHA's per-repo cache; halves cold-build time on
          # tag pushes that follow recent main commits.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          # Build amd64 only. The host runs amd64; multi-arch ramps the
          # build time without callers asking for it today. Add arm64
          # when a self-hoster requests it.
          platforms: linux/amd64

  release:
    # Only when a real `v*` tag triggered the workflow — manual runs
    # skip the release publish.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Checkout so the release body can be read from the repo's RELEASE_NOTES.md.
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Server ${{ github.ref_name }}'
          # Hand-written changelog — admins read this from the in-app Update
          # banner (/admin/system), so it must NOT be auto-generated. Update
          # RELEASE_NOTES.md per release; it also lists the published images.
          body_path: RELEASE_NOTES.md
