[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileheron-backend"
# Not the runtime version (that is the git tag via FH_VERSION); kept roughly in
# step for tooling that reads the package metadata.
version = "2.8.0"
description = "fileHeron backend - bidirectional self-hosted file-sharing platform"
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    # NOT `fastapi[standard]`: that extra pulls fastapi-cli -> fastapi-cloud-cli,
    # which drags a commercial cloud CLI, the Sentry SDK and two Rust-extension
    # packages (fastar, rignore) into the PRODUCTION image - about a sixth of
    # the lock file - for a `fastapi dev` command this project never runs
    # (uvicorn is the server; see docker/backend/Dockerfile). Everything the app
    # imports from the extra is declared explicitly below: httpx, jinja2,
    # python-multipart, pydantic-settings; email-validator and
    # pydantic-extra-types still arrive with the remaining extra
    # (audit 2026-07-30, deps-15).
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    # nh3 sanitises every admin-authored HTML fragment (legal pages + email
    # templates, v1.25.0). It has no transitive puller - omitting it
    # crash-looped v1.25.0/.1.
    "nh3>=0.2.18",
    # markdown-it-py is NOT used at runtime any more: the app authors HTML, and
    # the dead renderers in email.py/richtext.py were removed in the 2026-07-30
    # audit. It stays declared because alembic revision 202606130001 imports it
    # to convert pre-v1.50 Markdown content, and dropping it would break the
    # upgrade path for anyone still on an older release. It only ever rode in
    # via rich, so it must stay explicit.
    #
    # Audit #2 re-raised this as "a runtime dependency in the image that
    # processes untrusted uploads, reachable by nothing". Kept deliberately:
    # the alternative is an upgrade from pre-v1.50 that silently leaves email
    # overrides as raw Markdown, and a correct upgrade path beats a marginal
    # reduction in surface for a pure-Python parser that no request can reach.
    # Revisit when pre-v1.50 upgrades stop being supported.
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "python-json-logger>=2.0",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "babel>=2.16",
    # Direct dep of 6 app modules (oidc/jwks/hibp/release_check/webhook); was
    # [dev]-only, surviving in prod only transitively via fastapi[standard].
    "httpx>=0.27",
    "webauthn>=2.0",
    "reportlab>=4.0",
    "boto3>=1.34",
    # services/image.py: transcode the branding logo to a header-sized PNG for
    # the desktop client (v1.32.0).
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Pinned (not >=): ruff ships new lint rules every minor, so a floating spec
    # silently reddens a green main on the next release with zero code change, and
    # drifts from any local copy. Bump deliberately. Local gate must match:
    # `pip install --user --upgrade ruff==<this>` (or run ruff in an ephemeral python container).
    "ruff==0.16.0",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "moto[s3]>=5.0",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM"]
ignore = [
    "S101",   # assert used (tests + defensive invariants)
    "S104",   # bind to all interfaces (containerised; bound to 127.0.0.1 by compose)
    "B008",   # FastAPI Depends()/Query()/Header() in arg defaults - the framework idiom
    "S105",   # "hardcoded password" false positives: settings-key constants,
              # AuditEventType enum values, config field names - no real secrets
    "S110",   # try-except-pass: deliberate best-effort / fail-open blocks
    "S112",   # try-except-continue: same deliberate best-effort pattern
    "SIM105", # try-except-pass kept as-is (don't force contextlib.suppress) - same blocks
    "UP017",  # keep datetime.timezone.utc - the documented timestamp convention (CLAUDE.md)
    "UP042",  # keep `(str, enum.Enum)` not `StrEnum`: deliberate - SAEnum(native_enum=False)
              # + str() behaviour the code relies on; StrEnum would change serialization
    "ASYNC240", # pathlib in async fns: the stack has no anyio/trio Path; sync pathlib in
                # the ARQ workers is intentional, so this rule is inapplicable here
    "UP046",  # keep explicit `Generic[T]` on the Pydantic base model (PaginatedResponse) -
              # PEP-695 type params interact awkwardly with Pydantic v2 generic models
]

[tool.ruff.lint.per-file-ignores]
# Security lints that are noise in test code: hardcoded creds/keys in fixtures,
# /tmp paths, the migration test's literal SQL, and randomness for test data.
"tests/**/*.py" = ["S105", "S106", "S107", "S108", "S311", "S608"]

[tool.mypy]
python_version = "3.14"
strict_optional = true
warn_unused_ignores = true
# Wired into CI (infra-lint) since audit #2. It had been INSTALLED and never
# invoked, and this config read by nothing, for as long as both existed - so
# "mypy is set up" was true and "mypy runs" was not.
#
# It is introduced at a baseline that passes: the 47 modules below
# currently have errors (130 of them, mostly str-vs-Literal narrowing at
# response-model boundaries and untyped third-party callbacks) and are exempt
# per-module. Everything else is checked from now on. A gate added red is a
# gate nobody keeps; an exemption list is debt you can see and shorten.

[[tool.mypy.overrides]]
module = "app.database"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.models.inbound_attachment"
ignore_errors = true

[[tool.mypy.overrides]]
module = "app.models.inbound_message"
