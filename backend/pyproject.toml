[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileheron-backend"
version = "0.1.0"
description = "fileHeron backend — bidirectional self-hosted file-sharing platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "python-json-logger>=2.0",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "babel>=2.16",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "webauthn>=2.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
