[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fileheron-backend"
version = "0.1.0"
description = "fileHeron backend - bidirectional self-hosted file-sharing platform"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "pydantic>=2",
    "pydantic-settings>=2.1",
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    # email.py imports these directly (Markdown→HTML render + nh3 sanitise for the
    # admin-editable templates, v1.25.0). nh3 has no transitive puller - omitting
    # it crash-looped v1.25.0/.1; markdown-it-py only rode in via rich. Pin both.
    "markdown-it-py>=3.0",
    "nh3>=0.2.18",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "arq>=0.26",
    "python-json-logger>=2.0",
    "aiosmtplib>=3.0",
    "python-dotenv>=1.0",
    "babel>=2.16",
    "authlib>=1.3",
    # Direct dep of 6 app modules (oidc/jwks/hibp/release_check/webhook); was
    # [dev]-only, surviving in prod only transitively via fastapi[standard].
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "webauthn>=2.0",
    "reportlab>=4.0",
    "zipstream-ng>=1.8",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "aiosqlite>=0.20",
    "moto[s3]>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "ASYNC", "C4", "SIM"]
ignore = [
    "S101",   # assert used (tests + defensive invariants)
    "S104",   # bind to all interfaces (containerised; bound to 127.0.0.1 by compose)
    "B008",   # FastAPI Depends()/Query()/Header() in arg defaults - the framework idiom
    "S105",   # "hardcoded password" false positives: settings-key constants,
              # AuditEventType enum values, config field names - no real secrets
    "S110",   # try-except-pass: deliberate best-effort / fail-open blocks
    "S112",   # try-except-continue: same deliberate best-effort pattern
    "SIM105", # try-except-pass kept as-is (don't force contextlib.suppress) - same blocks
    "UP017",  # keep datetime.timezone.utc - the documented timestamp convention (CLAUDE.md)
]

[tool.ruff.lint.per-file-ignores]
# Security lints that are noise in test code: hardcoded creds/keys in fixtures,
# /tmp paths, the migration test's literal SQL, and randomness for test data.
"tests/**/*.py" = ["S105", "S106", "S107", "S108", "S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
