[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileheron-client"
version = "0.2.0"
description = "Desktop GUI client for the file:Heron self-hosted file-sharing platform."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "file:Heron contributors" }]
readme = "README.md"
dependencies = [
    "PySide6>=6.8,<6.9",
    "httpx>=0.27",
    "pydantic>=2.5",
    "keyring>=25",
    "platformdirs>=4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10.4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
fileheron-client = "fileheron_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fileheron_client = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
