[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fileheron-client"
version = "1.4.4"
description = "Desktop GUI client for the file:Heron self-hosted file-sharing platform."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "file:Heron contributors" }]
readme = "README.md"
dependencies = [
    # GUI stack (v0.4.0 migration from PySide6; v0.5.0 brought
    # tkinterdnd2 back after v0.4.11 fixed the actual culprit - a
    # self._root attribute shadowing tkinter.Misc._root in widget
    # subclasses, not the library itself):
    #   customtkinter: modern themeable wrapper over stdlib tkinter
    #   tkinterdnd2:   native drag-drop bindings on the file area
    # (tkcalendar was removed in the 2026-07-30 audit: GPL-3.0, and it was
    #  being linked into this MIT-licensed .exe. Replaced by
    #  fileheron_client.ui.date_entry on stdlib tkinter + CustomTkinter.)
    # Pure-Python total ~5-10 MB at install; vs PySide6/Qt6's ~150 MB.
    "customtkinter>=5.2",
    "tkinterdnd2>=0.4",
    # The IANA time-zone database. Windows ships none, so `zoneinfo.ZoneInfo`
    # raises there and the client silently fell back to the machine's local zone
    # - which is the exact defect the site-timezone support exists to fix, on
    # the only platform this client ships for. Caught by the Windows CI runner,
    # not by any Linux test (client-v1.3.0). Pure data, no code: tzdata itself
    # is public domain; the PyPI wrapper is Apache-2.0.
    "tzdata>=2024.1",
    "httpx>=0.27",
    "pydantic>=2.5",
    "keyring>=25",
    "platformdirs>=4",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.10", "pillow>=10.4"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
fileheron-client = "fileheron_client.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fileheron_client = ["py.typed", "locales/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

# Lint gate. The desktop client had NO lint or type gate at all - the backend's
# stopped at backend/ - and the first run found a genuine defect: a call to
# `safe_download_leaf` whose import was missing, which a structural test could
# not see and which would have raised NameError on every single-file download.
#
# Introduced at a PASSING baseline, like mypy was on the backend: the select
# list matches backend/pyproject.toml so the two agree on what "clean" means,
# and each ignore below carries the reason it is not simply a deferred fix.
[tool.ruff]
line-length = 120
target-version = "py312"   # the .exe bundles its own 3.12 interpreter

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = [
    "S101",    # assert: the test suite is 400+ of them
    "S110",    # try-except-pass: deliberate best-effort blocks (keyring, Tk
               # teardown, crash logging) where raising is the worse outcome
    "S105",    # "hardcoded password": keyring USERNAME constants and the
               # `kind="api_token"` discriminator - no secrets
    "S106",    # same, as a function argument
    "S108",    # "hardcoded temp file": tmp_path-based test fixtures
    "SIM105",  # contextlib.suppress over try/except/pass - the explicit form
               # is where the WHY comment lives on these paths
    "N818",    # DownloadCancelled / DownloadPaused: control-flow signals, not
               # errors, and renaming them to *Error would say the opposite
    "N802",    # setState/setText on the CTk widget wrappers mirror the widget
               # API they wrap; renaming half of a call site pair is worse
    "UP045",   # Optional[X] over X | None: 150 occurrences, cosmetic, and the
    "UP006",   # annotations here are read as documentation by the AST tests
    "UP035",
    "UP037",
    "UP017",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

