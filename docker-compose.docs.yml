# Docs-screenshot overlay: a THIRD file over docker-compose.e2e.yml, used by
# scripts/docs-screenshots.sh (the only way to run it: the script sets the
# project name, the ports and the secrets, and tears the stack down again). It
# changes only who the seeded accounts are, so the committed screenshots show
# the demo organisation the tour seeds (e2e/docs/seed.ts) instead of the e2e
# fixtures. The mounts are the e2e stack's, i.e. ./data of the checkout it runs
# from - the script refuses a data/ that holds anything.
services:
  backend:
    build:
      args:
        # The admin overview's status line shows it; the script passes the
        # newest release tag so the screenshot does not read "0.0.0-dev".
        FH_VERSION: ${DOCS_FH_VERSION:-0.0.0-dev}
    environment:
      # The tour renames this account "Anna Berger" and uses it as the admin.
      ADMIN_BOOTSTRAP_EMAIL: anna.berger@heron-demo.example
      # No seeded "E2E User" client in the users list.
      TEST_ACCOUNT_EMAIL: ""
