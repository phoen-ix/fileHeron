services:
  db:
    image: mariadb:11
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-db
    restart: unless-stopped
    # Resource ceilings — defense against runaway query / OOM. Tune
    # via `${DB_MEM_LIMIT:-2g}` etc. in your env if the defaults
    # don't fit your VPS. mem_limit + cpus are honored by docker
    # compose CLI in non-swarm mode.
    mem_limit: ${DB_MEM_LIMIT:-2g}
    cpus: ${DB_CPUS:-2.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-fileheron}
      MYSQL_USER: ${DB_USER:-fileheron_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - ./data/db:/var/lib/mysql
      - ./docker/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1.0}
    # noeviction + larger maxmemory so we never silently drop rate-limit
    # buckets or ARQ jobs under load. Under pressure, Redis writes start
    # erroring loudly — the ops_check cron surfaces those to admins
    # rather than silently breaking the per-IP login lockout.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - ./data/redis:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    # Production deploys pull a SemVer-tagged image from GHCR (published by
    # the `server-release.yml` workflow on every `v*` tag). `FH_TAG` lives
    # in `.env`; default `latest` always tracks the most recent release.
    # The dev override (`docker-compose.dev.yml`) reinstates `build:` so
    # the source tree drives local containers without touching GHCR.
    image: ghcr.io/phoen-ix/fileheron-backend:${FH_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-backend
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    cpus: ${BACKEND_CPUS:-2.0}
    ports:
      - "127.0.0.1:${APP_BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fileheron}
      DB_USER: ${DB_USER:-fileheron_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST_KIB: ${ARGON2_MEMORY_COST_KIB:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TEST_ACCOUNT_EMAIL: ${TEST_ACCOUNT_EMAIL:-}
      TEST_ACCOUNT_PASSWORD: ${TEST_ACCOUNT_PASSWORD:-}
      TEST_ACCOUNT_DISPLAY_NAME: ${TEST_ACCOUNT_DISPLAY_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@fileheron.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-fileHeron}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_NAME: ${APP_NAME:-fileHeron}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10}
      RATE_LIMIT_REGISTER: ${RATE_LIMIT_REGISTER:-3}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-100}
      TUS_HOOK_SECRET: ${TUS_HOOK_SECRET:?TUS_HOOK_SECRET is required}
      # Shared HMAC secret for backend → updater POSTs (Phase 4 self-update).
      # Backend signs every /apply request; updater verifies.
      UPDATER_HOOK_SECRET: ${UPDATER_HOOK_SECRET:?UPDATER_HOOK_SECRET is required}
      MAX_DIRECT_UPLOAD_BYTES: ${MAX_DIRECT_UPLOAD_BYTES:-104857600}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      AV_SKIP: ${AV_SKIP:-false}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/files}
      TUS_UPLOAD_DIR: ${TUS_UPLOAD_DIR:-/data/uploads}
      QUARANTINE_DIR: ${QUARANTINE_DIR:-/data/quarantine}
      TUS_PUBLIC_BASE: ${TUS_PUBLIC_BASE:-/uploads/}
    volumes:
      - ./data/files:/data/files
      - ./data/uploads:/data/uploads
      - ./data/quarantine:/data/quarantine
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # curl is in the slim image (Dockerfile installs it). -fsS fails on
      # non-2xx and stays quiet on success; --max-time 3 prevents a hung
      # backend from holding the healthcheck.
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  clamav:
    # Pinned to a specific patch — `:stable` drifts and breaks
    # reproducibility. Bump deliberately; check ClamAV release notes
    # for signature-DB format changes before moving.
    image: clamav/clamav:1.5.2
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-clamav
    restart: unless-stopped
    mem_limit: ${CLAMAV_MEM_LIMIT:-2g}
    cpus: ${CLAMAV_CPUS:-1.0}
    volumes:
      # Read-only access to finalized files for scanning.
      - ./data/files:/data/files:ro
      # Quarantine dir: writeable so the backend (mounted at the same path)
      # can move infected files into a path the worker container shares.
      - ./data/quarantine:/data/quarantine:rw
      # Signature DB persists across container restarts.
      - clamav-defs:/var/lib/clamav
    networks: [internal]
    healthcheck:
      # `clamdcheck.sh` ships with the official image; it short-circuits
      # to a TCP ping against clamd. Initial freshclam run is slow, so
      # start_period is generous.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  worker:
    image: ghcr.io/phoen-ix/fileheron-worker:${FH_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-worker
    restart: unless-stopped
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1.0}
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-fileheron}
      DB_USER: ${DB_USER:-fileheron_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TUS_HOOK_SECRET: ${TUS_HOOK_SECRET:?TUS_HOOK_SECRET is required}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data/files}
      TUS_UPLOAD_DIR: ${TUS_UPLOAD_DIR:-/data/uploads}
      QUARANTINE_DIR: ${QUARANTINE_DIR:-/data/quarantine}
      MAX_DIRECT_UPLOAD_BYTES: ${MAX_DIRECT_UPLOAD_BYTES:-104857600}
      TUS_PUBLIC_BASE: ${TUS_PUBLIC_BASE:-/uploads/}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      AV_SKIP: ${AV_SKIP:-false}
    volumes:
      - ./data/files:/data/files
      - ./data/uploads:/data/uploads
      - ./data/quarantine:/data/quarantine
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Wait for backend to be healthy. Both containers share entrypoint.sh,
      # which runs `alembic upgrade head`; running them in parallel races on
      # a fresh DB (e.g. concurrent ADD COLUMN → 1060). backend's healthcheck
      # turns green only after alembic completes, so worker's own alembic
      # call becomes a no-op against an already-migrated schema.
      backend:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      # ARQ doesn't expose a port. A working worker MUST be able to
      # reach Redis (it's the queue + cron tick source). Pinging Redis
      # from the worker container catches the common wedged-worker
      # failure modes (network split, Redis credentials drift, OOM
      # of the python process leaving the container "up" but idle).
      test: ["CMD", "python", "-c", "import redis; r=redis.Redis(host='redis', port=6379, socket_connect_timeout=3); r.ping()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  tusd:
    # Pinned — `:latest` is a moving pointer; tusd has had protocol-version
    # bumps that can desync from @uppy/tus on the SPA side.
    image: tusproject/tusd:v2.9.2
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-tusd
    restart: unless-stopped
    mem_limit: ${TUSD_MEM_LIMIT:-512m}
    cpus: ${TUSD_CPUS:-1.0}
    command:
      - "-upload-dir=/data/uploads"
      - "-base-path=/uploads/"
      - "-hooks-http=http://backend:8000/api/internal/tus-hooks"
      # Forward the signed-metadata header that the browser/API client puts on
      # each upload request (it carries the HMAC envelope authorising this
      # upload). tusd doesn't sign requests itself; auth rides on the metadata.
      - "-hooks-http-forward-headers=Upload-Metadata"
      - "-hooks-enabled-events=pre-create,pre-finish,post-finish,post-terminate"
      - "-behind-proxy"
      - "-disable-cors"  # CORS is handled by the front-facing proxy/Vite
    volumes:
      - ./data/uploads:/data/uploads
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # GET /uploads/ returns 405 (tusd only accepts POST/PATCH/etc on the
      # base path). Use /metrics which is always 200 once tusd is listening.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  frontend:
    image: ghcr.io/phoen-ix/fileheron-frontend:${FH_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-frontend
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    ports:
      - "127.0.0.1:${APP_FRONTEND_PORT:-8080}:80"
    networks: [internal]
    depends_on:
      # Wait for healthy upstreams so the first request through nginx
      # doesn't hit a 502 before backend / tusd are listening.
      backend:
        condition: service_healthy
      tusd:
        condition: service_healthy
    healthcheck:
      # nginx in this image listens on IPv4 only; busybox wget resolves
      # 'localhost' to ::1 first, which fails. Use 127.0.0.1 explicitly.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  updater:
    # Self-update sidecar. Owns /var/run/docker.sock so the backend
    # never has to. Reachable ONLY from inside the `internal` network
    # (no Traefik route, no published port, no external network).
    # Backend → updater requests are HMAC-signed with UPDATER_HOOK_SECRET.
    image: ghcr.io/phoen-ix/fileheron-updater:${FH_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-fileheron}-updater
    restart: unless-stopped
    mem_limit: ${UPDATER_MEM_LIMIT:-256m}
    cpus: ${UPDATER_CPUS:-0.5}
    environment:
      UPDATER_HOOK_SECRET: ${UPDATER_HOOK_SECRET:?UPDATER_HOOK_SECRET is required}
      UPDATER_WORKSPACE: /workspace
      UPDATER_STATE_FILE: /state/updater_state.json
      UPDATER_GHCR_OWNER: phoen-ix
    volumes:
      # Read+write so we can rewrite .env's FH_TAG line after a successful
      # update or rollback. The compose file itself is only read.
      - .:/workspace
      - ./data/updater:/state
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  clamav-defs: {}
