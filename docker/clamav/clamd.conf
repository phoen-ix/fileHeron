# fileHeron clamd configuration (audit H3).
#
# Based on the clamav/clamav:1.5.2 image's generated /etc/clamav/clamd.conf,
# with the file-/scan-size limits raised. With clamd's defaults (MaxFileSize
# 100M, MaxScanSize 400M) any upload larger than the limit is silently reported
# "clean" without being scanned - fileHeron supports uploads up to ~30 GB, so
# the antivirus gate the product promises was ineffective for exactly the
# large-file workload it was built for.
#
# !! MaxFileSize BELOW IS NOT WHAT YOU GET. clamd stores it in an int and
# silently clamps it to INT_MAX, so `MaxFileSize 30G` really becomes
# 2147483645 bytes (~2 GiB). clamd's own startup log is the ground truth:
#
#     Limits: Global size limit set to 32212254720 bytes.   <- MaxScanSize, applied
#     Limits: File size limit set to 2147483645 bytes.      <- MaxFileSize, CLAMPED
#
# So raising the value below does NOT extend antivirus coverage past ~2 GiB;
# there is no clamd configuration that does. This was found on 2026-07-30, when
# the original 30 GB fix turned out to have been ineffective above 2 GiB the
# whole time.
#
# The backend's AV_MAX_SCAN_BYTES (config.py) is therefore pinned to clamd's
# REAL ceiling, not to the value below. Files above it are still served, but are
# recorded with `files.av_unscanned = True`, shown as unscanned in the UI, and
# audited as file_served_unscanned - rather than being stored as `clean`, which
# is a verdict clamd never produced. Do not raise AV_MAX_SCAN_BYTES to "match"
# this file; that only restores the bug.
#
# NOTE: scanning multi-GB files is slow and (for archives) memory-hungry; size
# the clamav service's mem_limit accordingly and raise the value below to match
# your real maximum upload if it differs.

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# --- Raised scan limits (audit H3) ---
MaxFileSize 30G
MaxScanSize 30G
StreamMaxLength 30G
# 0 = no per-file scan-time cap, so a large but clean file is not reported
# inconclusive just because the scan took a while.
MaxScanTime 0
