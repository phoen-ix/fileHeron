# Honour the proxy's X-Forwarded-Proto. Traefik terminates TLS and forwards to
# this nginx over plain http, so `$scheme` here is "http". Overriding the
# forwarded value with `$scheme` made tusd (-behind-proxy) build http:// upload
# Locations, so TUS PATCH then 308-redirected http→https and uploads died.
# Pass Traefik's value through; fall back to $scheme for dev/direct access.
map $http_x_forwarded_proto $fh_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-braces security headers. Traefik should add these in
    # front, but defending in depth here keeps a Traefik-config drift
    # from exposing the SPA. `always` makes nginx send them on error
    # responses too (default is only on 2xx/3xx).
    # CSP intentionally omitted — Element Plus uses inline styles, so
    # a tight CSP needs per-route work; left to a follow-up.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # access_log is `off` on healthcheck, /api, /uploads, and /assets to
    # keep noise out of the SPA shell log. The reverse proxy (Traefik) is
    # the source of truth for request logs in production. Flip individual
    # locations back on if you need to debug specific traffic patterns.

    # Tiny healthcheck for the docker compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Long-cache for hashed assets (Vite emits chunks with content hashes).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Long-cache for self-hosted fonts (filenames include hashes from
    # @fontsource).
    location /fonts/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /api/* → backend (FastAPI on 8000).
    # client_max_body_size matches MAX_DIRECT_UPLOAD_BYTES (100 MB) + ~10%
    # headroom; without this nginx defaults to 1 MB and POST /api/uploads/direct
    # silently 413s for any non-trivial file.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 110m;
    }

    # /uploads/* → tusd (TUS protocol). Critical: do NOT buffer, do NOT cap
    # body size — uploads are streamed in chunks up to ~30 GB.
    # tusd listens on its default port 8080.
    location /uploads/ {
        proxy_pass http://tusd:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback — every non-asset, non-api, non-uploads path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
