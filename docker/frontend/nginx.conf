# Honour the proxy's X-Forwarded-Proto. Traefik terminates TLS and forwards to
# this nginx over plain http, so `$scheme` here is "http". Overriding the
# forwarded value with `$scheme` made tusd (-behind-proxy) build http:// upload
# Locations, so TUS PATCH then 308-redirected http→https and uploads died.
# Pass Traefik's value through; fall back to $scheme for dev/direct access.
map $http_x_forwarded_proto $fh_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Per-IP throttle for scanner-probe paths (see the bait locations below): sheds a
# vuln-scan flood at the edge so it can't hammer the backend. Legit traffic never
# hits these locations, so this zone never applies to real users.
limit_req_zone $binary_remote_addr zone=probe:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Belt-and-braces security headers. Traefik should add these in
    # front, but defending in depth here keeps a Traefik-config drift
    # from exposing the SPA. `always` makes nginx send them on error
    # responses too (default is only on 2xx/3xx).
    # CSP intentionally omitted - Element Plus uses inline styles, so
    # a tight CSP needs per-route work; left to a follow-up.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # access_log is `off` on healthcheck, /api, /uploads, and /assets to
    # keep noise out of the SPA shell log. The reverse proxy (Traefik) is
    # the source of truth for request logs in production. Flip individual
    # locations back on if you need to debug specific traffic patterns.

    # Tiny healthcheck for the docker compose healthcheck.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Long-cache for hashed assets (Vite emits chunks with content hashes).
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Long-cache for self-hosted fonts (filenames include hashes from
    # @fontsource).
    location /fonts/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Defense-in-depth: /api/internal/* is the tusd webhook receiver (HMAC
    # envelope + optional source-IP allowlist). It must NEVER be reachable from
    # the public internet; refuse it at the SPA proxy too, in case the front
    # Traefik config drifts (audit L6/L21). `^~` outranks the `/api/` prefix.
    location ^~ /api/internal/ {
        return 404;
    }

    # /api/* → backend (FastAPI on 8000).
    # client_max_body_size matches MAX_DIRECT_UPLOAD_BYTES (100 MB) + ~10%
    # headroom; without this nginx defaults to 1 MB and POST /api/uploads/direct
    # silently 413s for any non-trivial file.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        client_max_body_size 110m;
    }

    # /uploads/* → tusd (TUS protocol). Critical: do NOT buffer, do NOT cap
    # body size - uploads are streamed in chunks up to ~30 GB.
    # tusd listens on its default port 8080.
    location /uploads/ {
        proxy_pass http://tusd:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vuln-scanner bait. Real SPA routes never carry a file extension or a
    # dot-segment, so route obviously-malicious probes (/wp-login.php, /.env,
    # /.git/config, *.sql, *.bak, …) to the backend instead of the SPA shell.
    # FastAPI has no such route -> it returns the standard 404 NOT_FOUND envelope,
    # which the error-log capture records (with the real client IP + path) when
    # 404 is in the admin's 4xx allowlist. This is how scanning becomes visible:
    # scanners don't run the SPA's JS, and these paths otherwise 200 via the SPA
    # fallback. The denylist excludes legit static extensions (js/css/map/woff2/
    # png/ico/json/webmanifest/txt/xml/svg/html/wasm), so assets, favicon, robots
    # and real routes are untouched. `limit_req` sheds a scan flood at the edge.
    location ~* \.(php\d?|phtml|phar|asp|aspx|jsp|jspx|cgi|pl|py|rb|lua|sh|bash|ps1|bat|cmd|env|git|svn|hg|sql|sqlite|db|bak|backup|old|orig|swp|save|ini|conf|cfg|cnf|inc|log|war|jar|class|dll|so|exe|aws|htaccess|htpasswd|pem|key|crt|p12|pfx|yml|yaml)$ {
        limit_req zone=probe burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Dotfiles / dot-directories (e.g. /.env, /.git/config, /.aws/credentials),
    # excluding /.well-known/ (ACME, security.txt). Same treatment as above.
    location ~ ^/\.(?!well-known/) {
        limit_req zone=probe burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fh_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # SPA fallback - every non-asset, non-api, non-uploads path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
