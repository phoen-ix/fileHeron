# What every backend proxy location forwards (the tus location sets Host from
# $http_host instead, so it keeps its own four lines).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $fh_proto;
proxy_set_header X-Real-IP $remote_addr;
