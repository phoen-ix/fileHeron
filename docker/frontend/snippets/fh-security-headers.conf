# The server-level security headers, for a location that sets any add_header of
# its own: nginx then DISCARDS every add_header inherited from the server block,
# so such a location must re-declare the set. One copy (audit 2026-11-08); the
# server block keeps its own literal declarations as the default.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy-Report-Only $fh_csp always;
