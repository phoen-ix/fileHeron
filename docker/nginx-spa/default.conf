server {
    listen 80;
    server_name _;

    # Phase 1a placeholder. Phase 2 replaces this with the Vue build + SPA fallback.
    root /usr/share/nginx/html;
    index index.html;

    # Tiny healthcheck the compose healthcheck hits.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri /index.html;
    }
}
